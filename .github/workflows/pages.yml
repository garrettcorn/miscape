name: Website

# Publishes site/ to GitHub Pages, including the in-browser world at /play/
# (the game client plus the Go engine compiled to WebAssembly).
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "internal/**", "cmd/lanternfall-web/**", "tools/buildplay/**", "maps/**", "go.mod", "go.sum", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown in-game
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the in-browser world
        run: |
          export LF_VERSION="$(git describe --tags --always | sed 's/^v//')"
          go run ./tools/buildplay
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
